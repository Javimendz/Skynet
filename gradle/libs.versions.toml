sliding-root-nav = { group = "com.github.yarolegovich", name = "SlidingRootNav", version.ref = "slidingRootNav" }

# Jetpack Compose (Nota: Requiere Kotlin)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
